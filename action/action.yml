name: "More Eyes"
description: >-
  Reviews a pull request's diff with multiple LLMs via OpenRouter and reports
  grouped findings with agreement counts. Bring-your-own-key: set
  openrouter_api_key from a repo secret. Skips gracefully (never fails the
  run) when no key is available, e.g. on a fork PR.
author: "A-Liminal-Company"

inputs:
  openrouter_api_key:
    description: >-
      Your OpenRouter API key. Leave unset (e.g. on fork PRs, where secrets
      are not available) and the review is skipped successfully with a note
      in the job summary.
    required: false
    default: ""
  models:
    description: "Comma-separated model ids to run."
    required: false
    default: "claude-sonnet-5,gpt-5.5,gemini-3.5-flash"
  max_chars:
    description: "Per-batch character budget for diff chunking."
    required: false
    default: "30000"
  include:
    description: >-
      Comma-separated glob(s) of files to review. Empty means every file not
      excluded.
    required: false
    default: ""
  exclude:
    description: "Comma-separated glob(s) of files to skip."
    required: false
    default: "package-lock.json,*.lock,dist/**,*.min.*,vendor/**,vendored/**,node_modules/**"
  comment_mode:
    description: "summary | inline | both. Inline/both land in M3; M2 only writes the job summary."
    required: false
    default: "both"
  fail_on_severity:
    description: "none | high | medium. Minimum severity that can fail the run."
    required: false
    default: "none"
  min_agreement:
    description: >-
      Minimum number of models that must agree on a finding before it can
      fail the run under fail_on_severity. A single-model finding never
      breaks the build, however severe.
    required: false
    default: "2"
  redteam_model:
    description: >-
      Model id used to attempt a concrete exploit for each reported finding,
      adding a "demonstrated / not demonstrated" signal alongside agreement.
      Empty (the default) disables the pass. Costs one extra call per reported
      finding, and never fails the run — demonstrability is reported, not gated
      on.
    required: false
    default: ""
  redteam_categories:
    description: >-
      Comma-separated finding categories worth an exploit attempt. Add
      performance and style to widen it, at the cost of calls that usually have
      no exploit to find.
    required: false
    default: "security,bug,reliability"
  redteam_max_findings:
    description: >-
      Ceiling on exploit attempts for the whole run. A large diff is reviewed
      in batches, and this budget is shared across them rather than applying to
      each, so the cost of a run is bounded by this number regardless of how
      many batches the diff splits into.
    required: false
    default: "10"

  diff_path:
    description: >-
      Path to a unified diff file on the runner. When set, that diff is reviewed
      instead of the pull request's, on any event, and GITHUB_TOKEN is not needed.
      Built for release vetting: the workflow generates the upstream diff between
      two pinned versions and reviews that, not the one-line version bump.
    required: false
    default: ""
  review_title:
    description: "Title given to the models. Defaults to the PR number, or the diff file path."
    required: false
    default: ""
  review_description:
    description: >-
      Context given to the models. Defaults to the PR title. For release vetting,
      say what is being upgraded, from which version to which.
    required: false
    default: ""
  max_batches:
    description: >-
      Cap on diff batches reviewed (each costs one call per model). 0 = no cap.
      Anything dropped is reported in the summary and the `truncated` output.
    required: false
    default: "0"
  fail_on_truncation:
    description: "true = fail the run when max_batches left part of the diff unreviewed."
    required: false
    default: "false"

outputs:
  findings_count:
    description: "Total number of grouped findings reported."
  skipped:
    description: "true when the review was skipped (no key available, or the triggering event is not a pull request and no diff_path was given)."
  truncated:
    description: "true when max_batches left part of the diff unreviewed."

runs:
  # node20 is deprecated on GitHub runners (they already force node24); the
  # first dogfood run confirmed the bundle runs clean on 24.
  using: "node24"
  main: "dist/index.js"
