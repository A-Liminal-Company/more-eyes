name: Consensus Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `if: github.event.pull_request.head.repo.full_name == github.repository`
      # guard here on purpose — the action itself detects a missing
      # OPENROUTER_API_KEY (absent on fork PRs, where secrets aren't
      # forwarded) and skips successfully. That graceful-skip behavior is
      # the point of the fork-PR design, and this workflow dogfoods it.
      - uses: ./action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          # The whole roster, not the action's three-model default. This
          # workflow is the only place the full set runs against real traffic,
          # so it is also where a model that cannot honour the forced
          # tool_choice contract, or that provider.only leaves unroutable,
          # shows up as a recorded failure instead of a surprise in the app.
          models: claude-sonnet-5,gpt-5.5,gemini-3.5-flash,grok-4.5,mistral-large-3,nova-2-lite,inkling
          # A 500-line changelog reviewed by seven models is spend with no
          # finding at the end of it. README and CONTRIBUTING stay in — they
          # carry claims about the code that a reviewer can catch contradicting.
          exclude: package-lock.json,*.lock,dist/**,**/dist/**,*.min.*,vendor/**,**/vendor/**,vendored/**,**/vendored/**,node_modules/**,**/node_modules/**,CODE_REVIEW.md
          # Dogfoods the red-team pass, which otherwise only ever runs in the
          # web app. Costs one call per finding that survives the focused
          # view, bounded by redteam_max_findings (default 10), so a PR that
          # turns up nothing worth exploiting costs nothing extra.
          redteam_model: anthropic/claude-sonnet-5
