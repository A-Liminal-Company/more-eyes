name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Real Postgres rather than a stub, so the migration is exercised against
    # the same engine production runs.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: code_review_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/code_review_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Applies migration history rather than pushing the schema, so a missing
      # or broken migration fails CI instead of surfacing on a real database.
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm test
      - run: npm run build
