name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The jurisdiction check reads OpenRouter's live provider directory, which
  # changes without anything in this repo changing. A weekly run catches a
  # model that has picked up an out-of-policy provider on a quiet week.
  schedule:
    - cron: "17 5 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest

    # Real Postgres rather than a stub, so the migration is exercised against
    # the same engine production runs.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: code_review_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/code_review_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The root `tsc --noEmit` typechecks the mcp-server/ and action/
      # subpackage sources too, which need their own deps installed. Their
      # builds run further down as their real verification.
      - run: npm ci --prefix mcp-server
      - run: npm ci --prefix action
      - run: npx prisma generate
      # Applies migration history rather than pushing the schema, so a missing
      # or broken migration fails CI instead of surfacing on a real database.
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm test
      # Jurisdiction policy: fails if a rostered model is served by a provider
      # outside the allowlist in src/lib/provider-policy.ts. Hits OpenRouter's
      # public catalogue, so it needs no key — but it does need the network,
      # and a failure here is a policy question, not a flaky test.
      - run: npm run check:models
      - run: npm run build
      - run: npm run build --prefix mcp-server
      # Confirms the committed ncc bundle can be rebuilt; drift between
      # action/src and action/dist won't fail this, only a broken build will.
      - run: npm run build --prefix action
